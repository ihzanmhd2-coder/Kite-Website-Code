
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KITE | Product Details</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .product-detail {
      max-width: 1100px;
      margin: 60px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .product-detail img {
      width: 100%;
      border-radius: 16px;
      object-fit: cover;
    }

    .product-info h1 {
      color: #102b50;
      margin-bottom: 15px;
    }

    .product-info p {
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .back-link {
      display: inline-block;
      margin: 25px;
      color: #102b50;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .product-detail {
        grid-template-columns: 1fr;
        margin: 20px auto;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="index.html">
      <img src="images/logo.png" alt="KITE Logo" style="height:60px;">
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <a class="back-link" href="products.html">← Back to Products</a>

  <main class="product-detail">
    <div>
      <img id="productImage" src="" alt="Product image">
    </div>

    <div class="product-info">
      <h1 id="productName">Product Name</h1>
      <p id="productDescription">Product description</p>
      <a id="whatsappLink" class="btn" href="#" target="_blank">
        Enquire on WhatsApp
      </a>
    </div>
  </main>

  <script>
    const products = {
      "led-slim-board": {
        name: "LED Slim Board",
        image: "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=900&q=80",
        description: "Modern LED slim boards for attractive and professional business advertising. Ideal for shops, showrooms and commercial spaces."
      },

      "lollipop-board": {
        name: "Lollipop Sign Board",
        image: "https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=900&q=80",
        description: "Eye-catching lollipop sign boards designed to improve your business visibility and attract customers."
      },

      "newspaper-box": {
        name: "Newspaper Display Box",
        image: "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=900&q=80",
        description: "Durable and attractive newspaper display boxes for organised newspaper distribution and display."
      },

      "tshirt-printing": {
        name: "T-Shirt Printing",
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80",
        description: "Custom T-shirt printing for businesses, events, promotions, teams and special occasions."
      },

      "advertising-umbrella": {
        name: "Advertising Umbrella",
        image: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=900&q=80",
        description: "Promotional umbrellas that help display your brand and increase visibility during outdoor activities."
      },

      "printing-products": {
        name: "Printing Products",
        image: "https://images.unsplash.com/photo-1503428593586-e225b39bddfe?auto=format&fit=crop&w=900&q=80",
        description: "Printing solutions for business promotions, marketing materials and everyday business needs."
      },

      "display-stands": {
        name: "Display Stands",
        image: "https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=900&q=80",
        description: "Practical display stands for presenting products, promotional materials and advertising messages."
      }
    };

    const params = new URLSearchParams(window.location.search);
    const productId = params.get("product");
    const product = products[productId];

    if (product) {
      document.getElementById("productName").textContent = product.name;
      document.getElementById("productDescription").textContent = product.description;
      document.getElementById("productImage").src = product.image;
      document.getElementById("productImage").alt = product.name;

      const message = encodeURIComponent(
        "Hello KITE, I would like to enquire about " + product.name + "."
      );

      document.getElementById("whatsappLink").href =
        "https://wa.me/919847170154?text=" + message;
    } else {
      document.querySelector(".product-detail").innerHTML =
        "<h2>Product not found. Please visit our Products page.</h2>";
    }
  </script>

</body>
</html>
